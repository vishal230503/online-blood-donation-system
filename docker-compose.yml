# Production-style stack:  docker compose up -d --build
# Copy .env.example to .env and set real secrets first.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [obds]

  address-service:
    build:
      context: .
      dockerfile: address-service/Dockerfile
    image: ${REGISTRY:-local}/obds-address-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/address-db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
    networks: [obds]

  backend-service:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    image: ${REGISTRY:-local}/obds-backend-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      address-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/obds
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      ADDRESS_SERVICE_URL: http://address-service:9090
    networks: [obds]

  frontend:
    build:
      context: ./frontend-service
    image: ${REGISTRY:-local}/obds-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend-service
      - address-service
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks: [obds]

volumes:
  pgdata:

networks:
  obds:
